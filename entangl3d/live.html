<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>entangl3d — live Ethereum</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      color: #eaecef;
      font-family: "Courier New", Courier, monospace !important;
    }

    body {
      position: relative;
    }

    button,
    input {
      font-family: inherit;
    }

    canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .loader {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10000;
      width: calc(100% - 20px);
      height: 4px;
      transform: scaleX(0) translateY(-50%);
      transform-origin: left center;
      background: #00ff44;
      animation: expand 4s linear infinite alternate;
    }

    @keyframes expand {
      from {
        transform: scaleX(0) translateY(-50%);
      }

      to {
        transform: scaleX(1) translateY(-50%);
      }
    }

    #homeBtn,
    #png-screenshot-btn {
      position: fixed;
      top: 12px;
      z-index: 10010;
      display: none;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 7px;
      color: #fff;
      background: rgba(16, 18, 22, 0.9);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      text-decoration: none;
    }

    #homeBtn {
      left: 12px;
      width: 36px;
      height: 36px;
      font-size: 12px;
    }

    #png-screenshot-btn {
      right: 12px;
      width: 42px;
      height: 36px;
      font-size: 10px;
    }

    #tooltip {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10020;
      display: none;
      max-width: min(460px, 78vw);
      transform: translate(12px, 12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background: rgba(16, 18, 22, 0.95);
      color: #eaecef;
      padding: 10px 12px;
      pointer-events: none;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-line;
    }

    #status {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 10010;
      max-width: min(920px, 90vw);
      color: #00ff66;
      opacity: 0.9;
      font-size: 11px;
      text-align: right;
    }

    /*
      Hidden compatibility controls.

      The original entangl3d scripts may look these elements up by ID.
      They remain present but are not visible or interactive.
    */
    #compatibility-ui {
      display: none;
    }
  </style>

  <script src="https://takenstheorem.github.io/entangl3d/three.min.js"></script>
  <script src="https://takenstheorem.github.io/entangl3d/OrbitControls.js"></script>
  <script src="https://takenstheorem.github.io/entangl3d/pako.min.js"></script>
</head>

<body>
  <a
    id="homeBtn"
    href="https://takenstheorem.github.io/entangl3d"
    title="Home"
  >🏠</a>

  <button
    id="png-screenshot-btn"
    title="Copy PNG screenshot"
  >PNG</button>

  <div id="tooltip" role="status" aria-live="polite"></div>
  <div id="status">initializing…</div>
  <div id="loader" class="loader"></div>

  <canvas id="canvas"></canvas>

  <div id="compatibility-ui" aria-hidden="true">
    <input type="range" id="scrollSpeed" value="0.1">
    <span id="scrollSpeedValue">0.1</span>

    <input type="range" id="opacityFactor" value="5">
    <span id="opacityFactorValue">5</span>

    <input type="checkbox" id="persons">
    <input type="checkbox" id="colorful">
    <input type="checkbox" id="sparklineLog">

    <input type="text" id="blockNum">
    <button id="goBtn">Go</button>

    <button id="set_tx">tx</button>
    <button id="set_fee">fee</button>
    <button id="set_val">val</button>
    <button id="set_ival">i-val</button>

    <button id="gearBtn">Settings</button>
    <button id="legendBtn">Legend</button>

    <div id="sparkline-controls"></div>
    <div id="sparkline-container"></div>
  </div>

  <!-- Original rendering stack -->
  <script src="https://takenstheorem.github.io/entangl3d/config.js"></script>
  <script src="https://takenstheorem.github.io/entangl3d/stats.js"></script>
  <script src="https://takenstheorem.github.io/entangl3d/visuals.js"></script>
  <script src="https://takenstheorem.github.io/entangl3d/draw.js"></script>
  <script src="https://takenstheorem.github.io/entangl3d/animate.js"></script>
  <script src="live-draw.js?v=2"></script>

  <script>
    /*
      Examples:

      live.html
      live.html?blocks=32
      live.html?blocks=64
      live.html?blocks=64&receipts=1

      Function-selector colours:
        a9059cbb → #a9059c
        095ea7b3 → #095ea7
        23b872dd → #23b872

      Failed transactions always remain red.
    */

    const urlParams = new URLSearchParams(window.location.search);

    source_file = "live_rect.json";

    const BLOCK_COUNT = Math.min(
      64,
      Math.max(
        2,
        Number.parseInt(urlParams.get("blocks") || "64", 10) || 64
      )
    );

    const LOAD_RECEIPTS = urlParams.get("receipts") === "1";
    const RPC_TIMEOUT_MS = 18_000;
    const CONCURRENCY = 3;

    const FAILED_TX_COLOR = "#ff1710";
    const EMPTY_CALL_COLOR = "#00ff14";

    const RPCS = (
      urlParams.get("rpc") || [
        "https://ethereum-rpc.publicnode.com",
        "https://eth.drpc.org",
        "https://rpc.mevblocker.io",
        "https://rpc.flashbots.net",
        "https://eth.llamarpc.com",
        "https://cloudflare-eth.com"
      ].join(",")
    )
      .split(",")
      .map(url => url.trim().replace(/\/+$/, ""))
      .filter(Boolean);

    let preferredRpcIndex = 0;
    let rpcRequestId = 0;

    let transactionPickGroup = null;
    let transactionRaycaster = null;
    let transactionPointer = null;

    const statusEl = document.getElementById("status");
    const loaderEl = document.getElementById("loader");
    const canvasEl = document.getElementById("canvas");
    const tooltipEl = document.getElementById("tooltip");

    function say(message) {
      console.info("[entangl3d]", message);
      statusEl.textContent = message;
    }

    function hexToNumber(value) {
      if (typeof value !== "string") {
        return 0;
      }

      return Number.parseInt(value, 16) || 0;
    }

    function blockTag(blockNumber) {
      return "0x" + blockNumber.toString(16);
    }

    function without0x(value) {
      return String(value || "").replace(/^0x/i, "");
    }

    function weiToEth(value) {
      try {
        return Number(BigInt(value || "0x0")) / 1e18;
      } catch {
        return 0;
      }
    }

    function weiToDecimalString(value) {
      try {
        return BigInt(value || "0x0").toString(10);
      } catch {
        return "0";
      }
    }

    function formatEth(value) {
      if (!Number.isFinite(value)) {
        return "0";
      }

      if (value === 0) {
        return "0";
      }

      if (value < 0.000001) {
        return value.toExponential(4);
      }

      return value.toLocaleString(undefined, {
        maximumFractionDigits: 8
      });
    }

    function formatTime(date) {
      const pad = value => String(value).padStart(2, "0");

      return (
        `${date.getUTCFullYear()}-` +
        `${pad(date.getUTCMonth() + 1)}-` +
        `${pad(date.getUTCDate())} ` +
        `${pad(date.getUTCHours())}:` +
        `${pad(date.getUTCMinutes())}:` +
        `${pad(date.getUTCSeconds())}`
      );
    }

    function addrXY(address) {
      const clean = String(address || "")
        .toLowerCase()
        .replace(/^0x/, "")
        .padEnd(40, "0");

      const x = Number.parseInt(clean.slice(0, 8), 16) >>> 0;
      const y = Number.parseInt(clean.slice(8, 16), 16) >>> 0;

      return [
        (x % 1800) - 900,
        (y % 1800) - 900
      ];
    }

    /*
      First six hexadecimal characters from the function selector become
      a CSS/HTML colour.

      Examples:
        func = "a9059cbb" → "#a9059c"
        func = "095ea7b3" → "#095ea7"

      A simple ETH transfer has no selector, so it retains green.
    */
    function functionSelectorColor(func, failed) {
      if (failed) {
        return FAILED_TX_COLOR;
      }

      const normalized = String(func || "")
        .replace(/^0x/i, "")
        .replace(/[^0-9a-f]/gi, "")
        .toLowerCase();

      if (normalized.length < 6) {
        return EMPTY_CALL_COLOR;
      }

      return "#" + normalized.slice(0, 6);
    }

    function rpcErrorText(error) {
      if (!error) {
        return "Unknown RPC error";
      }

      if (typeof error === "string") {
        return error;
      }

      return `RPC ${error.code || ""}: ${error.message || "unknown error"}`;
    }

    async function requestRpc(url, payload) {
      const controller = new AbortController();

      const timeout = setTimeout(() => {
        controller.abort();
      }, RPC_TIMEOUT_MS);

      try {
        const response = await fetch(url, {
          method: "POST",
          /*
            No explicit Content-Type avoids a JSON CORS preflight.
          */
          body: JSON.stringify(payload),
          signal: controller.signal
        });

        const text = await response.text();

        let json;

        try {
          json = JSON.parse(text);
        } catch {
          throw new Error(`${url}: non-JSON HTTP ${response.status}`);
        }

        if (!response.ok) {
          throw new Error(
            `${url}: HTTP ${response.status}: ` +
            (json?.error?.message || "request failed")
          );
        }

        return json;
      } catch (error) {
        if (error.name === "AbortError") {
          throw new Error(`${url}: request timeout`);
        }

        if (error.name === "TypeError") {
          throw new Error(`${url}: CORS or network blocked`);
        }

        throw error;
      } finally {
        clearTimeout(timeout);
      }
    }

    async function rpcCall(method, params = []) {
      const payload = {
        jsonrpc: "2.0",
        id: ++rpcRequestId,
        method,
        params
      };

      const failures = [];

      for (let offset = 0; offset < RPCS.length; offset++) {
        const index = (preferredRpcIndex + offset) % RPCS.length;
        const url = RPCS[index];

        try {
          const response = await requestRpc(url, payload);

          if (response.error) {
            throw new Error(rpcErrorText(response.error));
          }

          preferredRpcIndex = index;

          return response.result;
        } catch (error) {
          failures.push(error.message);
          console.warn(`[${method}] ${error.message}`);
        }
      }

      throw new Error(
        `${method} failed on all RPCs: ${failures.join(" | ")}`
      );
    }

    async function mapWithConcurrency(items, limit, worker) {
      const results = new Array(items.length);
      let nextIndex = 0;

      async function runWorker() {
        while (true) {
          const index = nextIndex++;

          if (index >= items.length) {
            return;
          }

          try {
            results[index] = await worker(items[index], index);
          } catch (error) {
            console.warn("RPC request failed:", error.message);
            results[index] = null;
          }
        }
      }

      await Promise.all(
        Array.from(
          { length: Math.min(limit, items.length) },
          runWorker
        )
      );

      return results;
    }

    async function getEthPriceUsd() {
      try {
        const response = await fetch(
          "https://api.coinbase.com/v2/prices/ETH-USD/spot"
        );

        if (!response.ok) {
          throw new Error("Coinbase request failed");
        }

        const data = await response.json();
        const price = Number.parseFloat(data?.data?.amount);

        if (Number.isFinite(price)) {
          return price;
        }
      } catch (error) {
        console.warn("ETH price unavailable:", error.message);
      }

      return 0;
    }

    /*
      The original renderer may create a line material from `tx.color`,
      `tx.lineColor`, or a comparable transaction field depending on its
      implementation. These fields are included in every row.

      This function also attempts to recolour material-bearing rendered
      objects after scene creation, where source transaction metadata was
      preserved in object.userData.
    */
    function applyRenderedFunctionColors() {
      if (!window.scene) {
        return;
      }

      let recoloured = 0;

      window.scene.traverse(object => {
        const tx = object?.userData?.tx ||
          object?.userData?.transaction ||
          object?.userData?.transactionData;

        if (!tx || !tx.lineColor) {
          return;
        }

        const materials = Array.isArray(object.material)
          ? object.material
          : [object.material];

        for (const material of materials) {
          if (!material?.color) {
            continue;
          }

          material.color.set(tx.lineColor);
          material.needsUpdate = true;
          recoloured++;
        }
      });

      console.info(
        `[entangl3d] recoloured ${recoloured} rendered materials`
      );
    }

    /*
      Creates invisible-but-clickable copies of every loaded transaction line.

      Why this exists:
      - Thin WebGL lines are difficult to raycast reliably.
      - Existing scene geometry may be merged or transformed.
      - Picking is calculated from canvas.getBoundingClientRect(), so page
        position, browser scaling, and UI overlays do not offset the click.
    */
    function buildTransactionPickLayer() {
      if (!window.scene || !window.THREE) {
        return;
      }

      if (transactionPickGroup) {
        window.scene.remove(transactionPickGroup);
      }

      transactionPickGroup = new THREE.Group();
      transactionPickGroup.name = "entangl3d-transaction-pickers";

      const invisiblePickMaterial = new THREE.LineBasicMaterial({
        transparent: true,
        opacity: 0,
        depthWrite: false
      });

      let pickerCount = 0;

      for (const [blockKey, rows] of Object.entries(blocksData)) {
        const blockNumber = Number(blockKey);

        for (const tx of rows) {
          const geometry = new THREE.BufferGeometry();

          /*
            Transaction geometry in entangl3d is encoded in the same
            address-coordinate plane used by the renderer.
          */
          const points = [
            new THREE.Vector3(tx.fromx, tx.fromy, blockNumber),
            new THREE.Vector3(tx.tox, tx.toy, blockNumber)
          ];

          geometry.setFromPoints(points);

          const line = new THREE.Line(
            geometry,
            invisiblePickMaterial
          );

          line.userData.tx = tx;
          line.userData.blockNumber = blockNumber;
          line.name = `tx-picker-${tx.hash}`;

          transactionPickGroup.add(line);
          pickerCount++;
        }
      }

      window.scene.add(transactionPickGroup);

      transactionRaycaster = new THREE.Raycaster();
      transactionRaycaster.params.Line.threshold = 16;
      transactionPointer = new THREE.Vector2();

      console.info(
        `[entangl3d] built ${pickerCount.toLocaleString()} transaction pick lines`
      );
    }

    function showTransactionTooltip(tx, event) {
      const failed = tx.fail === 1;

      tooltipEl.style.display = "block";
      tooltipEl.style.left = `${event.clientX}px`;
      tooltipEl.style.top = `${event.clientY}px`;
      tooltipEl.style.borderColor = failed
        ? "rgba(255, 23, 16, 0.75)"
        : tx.lineColor;

      tooltipEl.textContent =
        `Block: ${tx.block}\n` +
        `Hash: 0x${tx.hash}\n` +
        `From: ${tx.from}\n` +
        `To: ${tx.to}\n` +
        `Value: ${formatEth(tx.value)} ETH\n` +
        `Fee: ${formatEth(tx.fee_eth)} ETH\n` +
        `Func: ${tx.func ? "0x" + tx.func : "—"}\n` +
        `Colour: ${tx.lineColor}\n` +
        `Status: ${failed ? "FAILED" : "SUCCESS"}\n\n` +
        `Click again to open Etherscan.`;
    }

    let lastPickedHash = null;
    let lastPickedAt = 0;

    function onCanvasTransactionClick(event) {
      if (
        !transactionRaycaster ||
        !transactionPointer ||
        !transactionPickGroup ||
        !window.camera
      ) {
        return;
      }

      /*
        Correct canvas-relative pointer calculation.

        Do not use clientX/window.innerWidth: that fails when canvas display
        dimensions differ from the browser viewport.
      */
      const bounds = canvasEl.getBoundingClientRect();

      transactionPointer.x =
        ((event.clientX - bounds.left) / bounds.width) * 2 - 1;

      transactionPointer.y =
        -((event.clientY - bounds.top) / bounds.height) * 2 + 1;

      transactionRaycaster.setFromCamera(
        transactionPointer,
        window.camera
      );

      const hits = transactionRaycaster.intersectObjects(
        transactionPickGroup.children,
        false
      );

      if (!hits.length) {
        tooltipEl.style.display = "none";
        lastPickedHash = null;
        return;
      }

      const tx = hits[0].object.userData.tx;

      if (!tx) {
        return;
      }

      const now = Date.now();

      /*
        First click inspects the transaction.
        A second click on the same selected line within 1.5 seconds opens it.
      */
      if (
        lastPickedHash === tx.hash &&
        now - lastPickedAt < 1500
      ) {
        window.open(
          `https://etherscan.io/tx/0x${tx.hash}`,
          "_blank",
          "noopener"
        );

        lastPickedHash = null;
        return;
      }

      lastPickedHash = tx.hash;
      lastPickedAt = now;

      showTransactionTooltip(tx, event);
    }

    function installTransactionPicker() {
      canvasEl.addEventListener(
        "click",
        onCanvasTransactionClick,
        false
      );

      canvasEl.addEventListener("pointermove", event => {
        if (tooltipEl.style.display !== "block") {
          return;
        }

        tooltipEl.style.left = `${event.clientX}px`;
        tooltipEl.style.top = `${event.clientY}px`;
      });
    }

    async function loadLive() {
      try {
        if (location.protocol === "file:") {
          throw new Error(
            "file:// detected. Serve this page through HTTP or HTTPS."
          );
        }

        say("finding browser-accessible Ethereum RPC…");

        const chainId = await rpcCall("eth_chainId");

        if (chainId !== "0x1") {
          console.warn("Unexpected chain:", chainId);
        }

        say("querying Ethereum chain head…");

        const latestBlock = hexToNumber(
          await rpcCall("eth_blockNumber")
        );

        if (!latestBlock) {
          throw new Error("Could not determine Ethereum chain head.");
        }

        const firstBlock = Math.max(
          1,
          latestBlock - BLOCK_COUNT + 1
        );

        const blockNumbers = Array.from(
          { length: latestBlock - firstBlock + 1 },
          (_, index) => firstBlock + index
        );

        say(`fetching ${blockNumbers.length} blocks…`);

        const blockResults = await mapWithConcurrency(
          blockNumbers,
          CONCURRENCY,
          blockNumber => rpcCall(
            "eth_getBlockByNumber",
            [blockTag(blockNumber), true]
          )
        );

        let receiptResults = new Array(blockNumbers.length).fill(null);
        let haveReceipts = false;

        if (LOAD_RECEIPTS) {
          say("fetching receipts…");

          receiptResults = await mapWithConcurrency(
            blockNumbers,
            2,
            blockNumber => rpcCall(
              "eth_getBlockReceipts",
              [blockTag(blockNumber)]
            )
          );

          haveReceipts = receiptResults.some(Array.isArray);

          /*
            Full raw receipts available in DevTools Console.
          */
          window.receiptResults = receiptResults;
          window.receiptsByBlock = Object.fromEntries(
            blockNumbers.map((blockNumber, index) => [
              blockNumber,
              Array.isArray(receiptResults[index])
                ? receiptResults[index]
                : []
            ])
          );
        }

        const ethPriceUsd = await getEthPriceUsd();

        /*
          Bare assignments are required: original renderer code reads lexical
          globals rather than properties such as window.blocksData.
        */
        blocksData = {};
        blockSummaries = {};

        let totalTransactions = 0;

        for (let index = 0; index < blockNumbers.length; index++) {
          const blockNumber = blockNumbers[index];
          const block = blockResults[index];

          if (!block || !Array.isArray(block.transactions)) {
            continue;
          }

          const receipts = Array.isArray(receiptResults[index])
            ? receiptResults[index]
            : [];

          const receiptByHash = new Map(
            receipts.map(receipt => [
              without0x(receipt.transactionHash).toLowerCase(),
              receipt
            ])
          );

          const rows = [];

          let valueTotalEth = 0;
          let feeTotalEth = 0;

          for (const tx of block.transactions) {
            const txHash = without0x(tx.hash).toLowerCase();
            const receipt = receiptByHash.get(txHash) || null;

            const valueWei = weiToDecimalString(tx.value);
            const valueEth = weiToEth(tx.value);

            let feeWei = 0n;

            if (receipt?.gasUsed && receipt?.effectiveGasPrice) {
              try {
                feeWei =
                  BigInt(receipt.gasUsed) *
                  BigInt(receipt.effectiveGasPrice);
              } catch {
                feeWei = 0n;
              }
            }

            const feeEth = Number(feeWei) / 1e18;

            const failed = receipt?.status
              ? hexToNumber(receipt.status) === 1
                ? 0
                : 1
              : 0;

            const func = tx.input && tx.input.length > 10
              ? tx.input.slice(2, 10).toLowerCase()
              : "";

            const lineColor = functionSelectorColor(
              func,
              failed === 1
            );

            valueTotalEth += valueEth;
            feeTotalEth += feeEth;

            const from = String(tx.from || "").toLowerCase();
            const to = tx.to
              ? String(tx.to).toLowerCase()
              : from;

            const [fromx, fromy] = addrXY(from);
            const [tox, toy] = addrXY(to);

            rows.push({
              block: blockNumber,
              from,
              to,
              fromx,
              fromy,
              tox,
              toy,

              /*
                Stored without 0x because renderer Etherscan code adds it.
              */
              hash: txHash,

              /*
                Required by original stats.js. Raw wei strings.
              */
              val: valueWei,
              fee: feeWei.toString(10),

              value: valueEth,
              value_wei: valueWei,
              value_usd: valueEth * ethPriceUsd,

              fee_eth: feeEth,
              fee_wei: feeWei.toString(10),
              fee_usd: feeEth * ethPriceUsd,

              gas_limit: hexToNumber(tx.gas),
              nonce: hexToNumber(tx.nonce),
              tx_type: hexToNumber(tx.type || "0x0"),

              fail: failed,
              func,

              /*
                Function-selector colour fields.

                `color`, `lineColor`, and `htmlColor` are intentionally all
                supplied for compatibility with different renderer paths.
              */
              color: lineColor,
              lineColor,
              htmlColor: lineColor,
              funcColor: lineColor,

              contract_call: !!(tx.input && tx.input.length > 2),
              contract_creation: !tx.to
            });
          }

          blocksData[blockNumber] = rows;
          totalTransactions += rows.length;

          const timestamp = new Date(
            hexToNumber(block.timestamp) * 1000
          );

          blockSummaries[blockNumber] = {
            id: blockNumber,
            time: formatTime(timestamp),
            gas_used: hexToNumber(block.gasUsed),
            transaction_count: rows.length,
            value_total_eth: valueTotalEth,
            value_total_usd: Number(
              (valueTotalEth * ethPriceUsd).toFixed(4)
            ),
            fee_total_usd: Number(
              (feeTotalEth * ethPriceUsd).toFixed(4)
            ),
            internal_value_total_usd: Number(
              (valueTotalEth * ethPriceUsd).toFixed(4)
            )
          };
        }

        const loadedBlocks = blockNumbers.filter(
          blockNumber => blocksData[blockNumber] !== undefined
        );

        if (loadedBlocks.length < 2) {
          throw new Error("Fewer than two usable blocks were returned.");
        }

        if (totalTransactions === 0) {
          throw new Error("Loaded blocks contained zero transactions.");
        }

        minBlock = Math.min(...loadedBlocks);
        maxBlock = Math.max(...loadedBlocks);
        currentPage = minBlock;
        targetPage = minBlock;
        currentZ = minBlock;

        say(
          `building ${loadedBlocks.length} blocks / ` +
          `${totalTransactions.toLocaleString()} transactions…`
        );

        initScene();

        selectedTransactionIndex = 0;

        /*
          Give the original renderer one frame to build its objects, then:
          - apply colours where it preserves source tx userData;
          - build reliable invisible click-picking lines.
        */
        requestAnimationFrame(() => {
          applyRenderedFunctionColors();
          buildTransactionPickLayer();
          installTransactionPicker();
        });

        document.getElementById("homeBtn").style.display = "flex";
        document.getElementById("png-screenshot-btn").style.display = "flex";

        loaderEl.style.display = "none";

        const activeRpc = RPCS[preferredRpcIndex]
          .replace(/^https?:\/\//, "");

        say(
          `double click => Etherscan; live: ${minBlock}–${maxBlock} · ` +
          `${totalTransactions.toLocaleString()} tx · ` +
          `${haveReceipts ? "receipts ✓" : "receipts off"} · ` +
          activeRpc
        );
      } catch (error) {
        console.error(error);

        loaderEl.style.animation = "none";
        loaderEl.style.transform = "scaleX(1) translateY(-50%)";
        loaderEl.style.background = "#ff2b1c";

        say(`live load failed: ${error.message}`);
      }
    }

    window.addEventListener("resize", () => {
      if (!window.camera || !window.renderer) {
        return;
      }

      window.camera.aspect = window.innerWidth / window.innerHeight;
      window.camera.updateProjectionMatrix();
      window.renderer.setSize(window.innerWidth, window.innerHeight);

      if (window.controls) {
        window.controls.update();
      }
    });

    document.addEventListener("wheel", event => {
      if (!Number.isFinite(minBlock) || minBlock <= 0) {
        return;
      }

      event.preventDefault();

      isScrolling = true;

      if (event.deltaY > 0) {
        targetPage = Math.min(
          maxBlock,
          targetPage + scrollSpeed
        );
      } else {
        targetPage = Math.max(
          minBlock,
          targetPage - scrollSpeed
        );
      }
    }, { passive: false });

    let galleryInterval = null;

    function startGallery() {
      if (galleryInterval) {
        return;
      }

      isScrolling = true;

      galleryInterval = setInterval(() => {
        document.dispatchEvent(
          new WheelEvent("wheel", {
            deltaY: scrollSpeed,
            deltaMode: 0,
            view: window
          })
        );
      }, 50);
    }

    function stopGallery() {
      isScrolling = false;

      if (galleryInterval) {
        clearInterval(galleryInterval);
        galleryInterval = null;
      }
    }

    document.addEventListener("keydown", event => {
      if (event.key.toLowerCase() !== "g") {
        return;
      }

      if (galleryInterval) {
        stopGallery();
      } else {
        startGallery();
      }
    });

    document.getElementById("png-screenshot-btn").addEventListener(
      "click",
      async event => {
        event.preventDefault();

        try {
          const blob = await new Promise(resolve => {
            canvasEl.toBlob(resolve, "image/png");
          });

          if (!blob) {
            throw new Error("PNG generation failed.");
          }

          await navigator.clipboard.write([
            new ClipboardItem({
              "image/png": blob
            })
          ]);

          say("PNG screenshot copied to clipboard.");
        } catch (error) {
          console.error(error);
          say("Screenshot failed.");
        }
      }
    );

    loadLive();
  </script>
</body>
</html>
