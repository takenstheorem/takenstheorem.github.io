<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CORPUS // State of the Collective</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;cursor:crosshair;font:11px 'Courier New',monospace}
  #piece-frame,#overlay{position:absolute;top:0;left:0;width:100%;height:100%}
  #piece-frame{z-index:0;border:0;background:#000}
  #overlay{pointer-events:none;z-index:10;border:20px solid rgba(255,0,0,.04);background:radial-gradient(circle,transparent 50%,rgba(0,0,0,.85) 100%)}

  #info-container {
    position: fixed;
    top: 28px;
    left: 28px;
    z-index: 30;
  }

  #info-trigger {
    width: 26px;
    height: 26px;
    background: #000;
    border: 1px solid rgba(255,255,255,0.45);
    color: rgba(255,255,255,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s ease;
  }

  #info-trigger:hover,
  #info-container.active #info-trigger {
    color: #000;
    background: #fff;
    border-color: #fff;
  }

  /* Hidden Dropdown Title Card */
  #title-card {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    user-select: none;
    background: #000;
    border: 1px solid #fff;
    padding: 14px 22px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-6px);
    transition: opacity 0.22s ease, transform 0.22s ease;
  }

  #title-card::before {
    content: '';
    position: absolute;
    top: -10px;
    left: 0;
    width: 100%;
    height: 10px;
  }

  /* Reveal on Hover or Click (.active) */
  #info-container:hover #title-card,
  #info-container.active #title-card {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .title-text{
    color:#fff;
    font-size:24px;
    font-weight:900;
    letter-spacing:6px;
    text-transform:uppercase;
    display:block;
    line-height:1;
    text-shadow:none;
  }

  .byline{
    margin-top:7px;
    display:block;
    color:rgba(255,255,255,0.65);
    font-size:13px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    text-shadow:none;
  }

  .nav-links{
    display:flex;
    gap:12px;
    margin-top:14px;
    font-size:13px;
    letter-spacing:1.5px;
    text-transform:uppercase;
  }

  .nav-links a{color:rgba(255,255,255,.6);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.35);padding-bottom:2px}
  .nav-links a:hover{color:#fff;border-color:#fff}

  #state-mark{
    position:absolute;
    left:28px;
    bottom:28px;
    z-index:30;
    color:rgba(255,255,255,.55);
    font-size:10px;
    letter-spacing:3px;
    text-transform:uppercase;
    user-select:none;
  }
</style>
</head>
<body>
  <div id="overlay"></div>
  <div id="state-mark">STATE // QUERYING MAINNET</div>

  <div id="info-container">
    <div id="info-trigger">?</div>
    <div id="title-card">
      <span class="title-text">CORPUS</span>
      <span class="byline">BY <a href="https://takenstheorem.github.io" style="color:rgba(255,255,255,.6);text-decoration:none;">TAKENS THEOREM</a></span>
      <span class="nav-links"><a href="about.html">Overview</a></span>
      <span class="nav-links"><a href="dashboard.html">DASHBOARD</a></span>
      <span class="nav-links"><a href="https://superrare.com/liquid-editions/1/0x89Ab9b5fCa71a8BE8E00480c7d042a5444ED1D33">Liquid Edition on SR</a></span>
      Post: <span class="nav-links"><a href="https://x.com/takenstheorem/status/2094079910151409682">GETTING BOTTED</a></span>
      Post: <span class="nav-links"><a href="https://x.com/takenstheorem/status/2096989425221951856">VOTE PLAN</a></span>
    </div>
  </div>

  <iframe id='piece-frame' title='Live CORPUS' sandbox='allow-scripts' allowfullscreen></iframe>

<script src='https://cdn.jsdelivr.net/npm/ethers@6.15.0/dist/ethers.umd.min.js'></script>
<script>
const RENDERER='0x900736A86e55BA38981394Fa69EDc61AA465c679';
const RPC_URL='https://eth-mainnet.g.alchemy.com/v2/tP22aP3IvV7K9nbbepaFV6ayJ-UmXz1-';
const provider=new ethers.JsonRpcProvider(RPC_URL);
const renderer=new ethers.Contract(RENDERER,['function tokenURI() view returns (string)'],provider);

function parseDataUriJson(uri){
  if(uri.startsWith('data:application/json;base64,'))return JSON.parse(atob(uri.slice('data:application/json;base64,'.length)));
  const comma=uri.indexOf(',');
  return JSON.parse(decodeURIComponent(uri.slice(comma+1)));
}

function htmlFromAnimationUrl(url){
  if(url.startsWith('data:text/html;base64,'))return atob(url.slice('data:text/html;base64,'.length));
  const comma=url.indexOf(',');
  return decodeURIComponent(url.slice(comma+1));
}

const infoContainer = document.getElementById('info-container');
const infoTrigger = document.getElementById('info-trigger');

infoTrigger.addEventListener('click', (e) => {
  e.stopPropagation();
  infoContainer.classList.toggle('active');
});

document.addEventListener('click', (e) => {
  if (!infoContainer.contains(e.target)) {
    infoContainer.classList.remove('active');
  }
});

document.getElementById('title-card').onmousedown=e=>e.stopPropagation();

async function loadLivePiece(){
  const frame=document.getElementById('piece-frame');
  const mark=document.getElementById('state-mark');
  try{
    mark.textContent='STATE // QUERYING MAINNET';
    const uri=await renderer['tokenURI()']();
    const metadata=parseDataUriJson(uri);
    frame.srcdoc=htmlFromAnimationUrl(metadata.animation_url);
    mark.textContent='STATE // LIVE ON-CHAIN';
  }catch(error){
    console.error('Live corpus load failed',error);
    mark.textContent='STATE // RPC UNAVAILABLE';
  }
}

loadLivePiece();
</script>
</body>
</html>
