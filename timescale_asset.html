vec2 fieldFn(vec2 px,vec2 lightPx,vec4 R,vec4 I){

vec2 p2=px+a*(dir*(62.0*motion*uFA*w1*w1)+tang*(32.0*motion*uMA*sin(rr*0.007-uMP+ph*1.7*tempo)));

function cut(list,n,gam,spr,ch){

const r=list.splice(bi,1)[0],w=r[2]-r[0],h=r[3]-r[1];

function buildLayout(){

const nb=hasBus?N-1:N;
const blocks=[];
bands.forEach((b,i)=>{
const k=Math.max(1,Math.round(nb*areas[i]/tot));
cut([b],k,gam,spr,ch).forEach(r=>blocks.push({r,bus:false}));
});
if(hasBus)blocks.push({r:[m,yb,1-m,yb+busH],bus:true});
return blocks;}
function rebuildLayout(seed){
layoutSeed=Math.max(0,Math.floor(seed));
rs=((Math.imul(layoutSeed+1,0x9E3779B1)>>>0)%2147483646)+1;
for(let i=0;i<8;i++)rnd();
const blocks=buildLayout().slice(0,NR);
const tiles=blocks.filter(b=>!b.bus);
const mean=tiles.reduce((s,b)=>s+(b.r[2]-b.r[0])*(b.r[3]-b.r[1]),0)/Math.max(1,tiles.length);
rd.fill(9);idf.fill(0);
blocks.forEach((b,i)=>{
const[x0,y0,x1,y1]=b.r;
let type,cs,film=250+rnd()*280,metal;
if(b.bus){type=6;cs=2.8+rnd()*0.5;film=300;metal=2;}
else{
const a=(x1-x0)*(y1-y0)/mean,k=rnd();
if(a>2.2){type=[0,4,10,11][Math.floor(k*4)];cs=1.0+rnd()*0.6;}
else if(a>1.0){type=[9,8,0,2,10][Math.floor(k*5)];cs=0.8+rnd()*0.4;}
else if(a>0.35){type=[1,8,7,9,2,5][Math.floor(k*6)];cs=0.7+rnd()*0.3;}
else{type=[7,5,3,1][Math.floor(k*4)];cs=0.5+rnd()*0.4;}
metal=a>1.0?(rnd()<0.5?0:2):(rnd()<0.5?3:0);
}
rd.set(b.r,i*4);idf.set([type,cs,film,metal],i*4);});
gl.uniform4fv(u.uRect,rd);gl.uniform4fv(u.uInfo,idf);
gl.uniform1f(u.uSeed,layoutSeed%97+1);applyPalette(layoutSeed);}
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const sm=v=>{v=cl(v);return v*v*(3-2*v);};
const num=x=>{const n=Number(x);return Number.isFinite(n)?n:NaN;};
let raw=null,live=false,feed={l:[0.25,0.25,0.25],vis:0,ph:0,mv:0,tempC:null};
const TAU=2*Math.PI,AXIS_PHASE_RATE=0.05;
let fastPhase=0,mediumPhase=0,slowPhase=0,axisPhase=0,workAcc=0;
function applyScenario(v){
const n={...v,l:[...v.l]};
const sec=Date.now()/1000,slot=Math.floor(sec/3);
const p=0.5+0.5*Math.sin((sec%180)/180*TAU-Math.PI/2);
const rr=k=>{const x=Math.sin(slot*12.9898+k*78.233)*43758.5453;return x-Math.floor(x);};
if(scenario==='empty'){n.ph=0;n.vis=0;n.mv=0;}
else if(scenario==='crowded'){n.ph=Math.round(15+25*p);n.vis=Math.round(2+10*p);n.mv=0.4+1.6*p;}
else if(scenario==='hot'){n.tempC=(v.tempC??45)+25+15*p;}
else if(scenario==='busy'){n.l=[0.65+0.35*p,0.9+0.5*p,1.15+0.65*p];}
else if(scenario==='random'){n.l=[rr(1),rr(2),rr(3)].map(x=>0.08+x*2.4);n.ph=Math.round(rr(4)*40);n.vis=Math.round(rr(5)*15);n.mv=rr(6)*8;n.tempC=30+rr(7)*65;}
return n;}
function flowWeights(){const l=feed.l.map(x=>Math.max(0,x));const t=l.reduce((s,x)=>s+x,0);return t>0?l.map(x=>Math.sqrt(x)/t):[0,0,0];}
function ingest(j){
const v=j?.v??j??{};
const l=[v['cpu.load1'],v['cpu.load5'],v['cpu.load15']].map(num);
if(l.some(x=>!Number.isFinite(x)))return;
const tc=num(v['temp.cpu']??v['temp.cpu_c']??v['cpu.temp_c']??v.temp?.cpu_c);
raw={l:l.map(x=>Math.max(x,0)),vis:Math.max(0,Math.round(num(v['visitors.connected'])||0)),ph:Math.max(0,Math.round(num(v['room.phones_estimate'])||0)),mv:Math.abs(num(v['air_2g.motion_change_db'])||0),tempC:Number.isFinite(tc)?tc:null};
feed=applyScenario(raw);
live=true;}
function simulate(now){const t=now/1000;raw={l:[0.9+0.7*Math.sin(t/5),0.9+0.5*Math.sin(t/13+1),0.9+0.4*Math.sin(t/29+2)].map(x=>Math.max(x,0.05)),vis:3,ph:15,mv:0.2,tempC:43.3};feed=applyScenario(raw);}
function loadShares(){const l=feed.l.map(x=>Math.max(0,x));const t=l.reduce((s,x)=>s+x,0);return t>0?[l,l.map(x=>x/t)]:[[0,0,0],[0,0,0]];}
function hud(){
const on=live;const s=loadShares();
hudEl.textContent=['Timescale',
`Φ(t) = ∫(L₁₅ − L₁)dt   Φ=${workAcc.toFixed(2)}`,
`cpu_load 1m  ${on?s[1][0].toFixed(2):'--'}`,
`cpu_load 5m  ${on?s[1][1].toFixed(2):'--'}`,
`cpu_load 15m ${on?s[1][2].toFixed(2):'--'}`,
`phones      ${on?feed.ph:'--'}`,
`visitors    ${on?feed.vis:'--'}`,
`movement    ${on?feed.mv.toFixed(2)+' dB':'--'}`,
`temperature ${on&&feed.tempC!==null?feed.tempC.toFixed(1)+'°C':'--'}`].join('\n');}
let ctrl=null,pid=0;
async function poll(){
if(ctrl)ctrl.abort();
const c=new AbortController(),id=++pid;ctrl=c;
const t=setTimeout(()=>c.abort(),1800);
try{const r=await fetch(API,{signal:c.signal,cache:'no-store'});if(!r.ok)throw new Error(r.status);const d=await r.json();if(id===pid)ingest(d);}
catch(e){if(id===pid)live=false;}
finally{clearTimeout(t);if(ctrl===c)ctrl=null;if(id===pid)hud();}}
setInterval(poll,POLL_MS);
function resize(){
const d=Math.min(devicePixelRatio||1,2);const w=stage.clientWidth,h=stage.clientHeight;
cv.width=Math.round(w*d);cv.height=Math.round(h*d);
hudEl.style.fontSize=(h*0.0102).toFixed(1)+'px';
gl.viewport(0,0,cv.width,cv.height);
gl.uniform2f(u.uRes,cv.width,cv.height);
gl.uniform1f(u.uPitch,Math.max(2,cv.width/1400));}
addEventListener('resize',resize);
const query=new URLSearchParams(location.search);
const tokenValue=query.get('tokenid')??query.get('tokenId')??query.get('token');
const tokenNumber=tokenValue===null?5:Number(tokenValue);
const tokenId=Number.isFinite(tokenNumber)&&tokenNumber>=0?Math.floor(tokenNumber):5;
rebuildLayout(tokenId);
resize();
const LIGHT_BOUNDS={x0:0.24,x1:0.76,y0:0.43,y1:0.57};
let pass={s:0,d:0,from:[0.5,0.5],to:[0.5,0.5]};
function newPass(now){const from=pass.to;let to;do{to=[LIGHT_BOUNDS.x0+Math.random()*(LIGHT_BOUNDS.x1-LIGHT_BOUNDS.x0),LIGHT_BOUNDS.y0+Math.random()*(LIGHT_BOUNDS.y1-LIGHT_BOUNDS.y0)];}while(Math.hypot(to[0]-from[0],to[1]-from[1])<0.24);pass={s:now,d:22000+Math.random()*8000,from,to};}
newPass(performance.now());
poll();hud();
let last=performance.now();
function frame(now){
const dt=Math.min(0.1,(now-last)/1000);last=now;
if(!live)simulate(now);
else feed=applyScenario(raw);
const weights=flowWeights();
workAcc=cl(workAcc+weights[2]-weights[0],-10,10);
const phones=cl(feed.ph/24),visitors=cl(Math.sqrt(feed.vis)/6),movement=cl(feed.mv/MOTION_SAT);
const temperature=feed.tempC===null?0:cl(feed.tempC/80);
const activity=ACT*(phones+visitors+movement+temperature/10+workAcc/100)/4;
const [baseFA,baseMA,baseSA]=weights.map(w=>w*activity);
const slowBias=sm(cl((workAcc+10)/10)),fastBias=1-slowBias;
const fastScale=0.35+1.65*fastBias,slowScale=0.35+1.65*slowBias;
const middleScale=0.65+0.7*(1-Math.abs(2*slowBias-1));
const uFA=baseFA*FAG*fastScale,uMA=baseMA*MAG*middleScale,uSA=baseSA*SAG*slowScale;
fastPhase=(fastPhase+dt*2.4*uFA)%TAU;
mediumPhase=(mediumPhase+dt*2.9*uMA)%TAU;
slowPhase=(slowPhase+dt*3.24*0.14*uSA)%TAU;
axisPhase=(axisPhase+dt*3.24*0.14*uSA*AXIS_PHASE_RATE)%TAU;
let t=(now-pass.s)/pass.d;
if(t>=1){newPass(now);t=0;}
t=cl(t);
const q=0.5-0.5*Math.cos(Math.PI*t);
gl.uniform2f(u.uLight,pass.from[0]+(pass.to[0]-pass.from[0])*q,pass.from[1]+(pass.to[1]-pass.from[1])*q);
gl.uniform1f(u.uLightK,0.82+0.18*sm(t/0.15)*sm((1-t)/0.15));
gl.uniform1f(u.uFP,fastPhase);gl.uniform1f(u.uMP,mediumPhase);
gl.uniform1f(u.uSP,slowPhase);gl.uniform1f(u.uAP,axisPhase);
gl.uniform1f(u.uFA,uFA);gl.uniform1f(u.uMA,uMA);gl.uniform1f(u.uSA,uSA);
gl.drawArrays(gl.TRIANGLES,0,3);
requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
